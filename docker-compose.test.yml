services:
  tubemin:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:7005:3000"
    volumes:
      - ./data/downloads:/downloads
      - ./data/peertube-import:/peertube-import
      - ./local-data:/data
    depends_on:
      metube:
        condition: service_started
      peertube:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    volumes:
      - ./data/downloads:/downloads
    environment:
      DOWNLOAD_DIR: /downloads
      YTDL_OPTIONS: '{"writeinfojson": true, "writethumbnail": true, "writesubtitles": true, "writeautomaticsub": true}'

  peertube:
    image: chocobozzz/peertube:production-bookworm
    restart: unless-stopped
    env_file: .env
    environment:
      PT_INITIAL_ROOT_PASSWORD: "${PEERTUBE_ADMIN_PASSWORD}"
      PEERTUBE_DB_USERNAME: postgres
      PEERTUBE_DB_PASSWORD: postgres
      PEERTUBE_DB_HOSTNAME: postgres
      PEERTUBE_DB_NAME: peertube
      PEERTUBE_DB_PORT: 5432
    ports:
      - "127.0.0.1:7006:9000"
    volumes:
      - ./local-data/peertube:/data
      - ./data/peertube-import:/peertube-import
    depends_on:
      peertube_redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/api/v1/config > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - default
      - postgres_default

  peertube_redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./local-data/redis:/data

networks:
  postgres_default:
    external: true
