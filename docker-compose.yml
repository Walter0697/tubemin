# docker-compose.yml
services:
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tubemin

  tubemin:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports:
      - "7005:3000"
    volumes:
      - ./data/downloads:/downloads
      - ./data/peertube-import:/peertube-import
      - tubemin_data:/data
    depends_on:
      metube:
        condition: service_started
      peertube:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 but the app binds IPv4 only
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Tubemin provisions its PeerTube account/OIDC configuration before it
      # binds port 3000, so allow that startup work to finish before probing.
      start_period: 60s

  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    volumes:
      - ./data/downloads:/downloads
    environment:
      DOWNLOAD_DIR: /downloads
      # Keep downloads simple: subtitles/auto-captions can trigger 429s on some YouTube videos.
      YTDL_OPTIONS: '{"writeinfojson": true, "writethumbnail": true}'

  peertube:
    image: chocobozzz/peertube:production-bookworm
    restart: unless-stopped
    env_file: .env
    environment:
      PT_INITIAL_ROOT_PASSWORD: ${PEERTUBE_ADMIN_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - peertube_data:/data
      - ./data/peertube-import:/peertube-import
    depends_on:
      - peertube_db
      - peertube_redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/v1/config > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  peertube_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: peertube
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: ${PEERTUBE_DB_PASSWORD}
    volumes:
      - peertube_db_data:/var/lib/postgresql/data

  peertube_redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - peertube_redis_data:/data

  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "18096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./data/jellyfin/media:/media

  jellypik:
    build: ../jellypik
    restart: unless-stopped
    env_file: .env
    environment:
      PEERTUBE_URL: http://peertube:9000
      PEERTUBE_HOST: localhost:7006
      TUBEMIN_URL: http://tubemin:3000
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_PUBLIC_URL: http://localhost:18096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      JELLYFIN_MEDIA_ROOT: /media
      JELLYPIK_MEDIA_ROOT: /media
      JELLYPIK_SOURCE_IMPORT_ROOT: /source-import
      DATABASE_URL: sqlite:///data/jellypik.sqlite3
      WCODEX_RUNNER_URL: http://wcodex.home/
      JELLYPIK_DOMAIN: localhost:18080
      JELLYPIK_LISTEN_ADDR: 0.0.0.0:8080
      AUTH_MODE: password
      ADMIN_PASSWORD: "123456"
      JELLYPIK_COOKIE_SECURE: "false"
    ports:
      - "18080:8080"
    volumes:
      - ../jellypik/data:/data
      - ./data/peertube-import:/source-import
      - ./data/jellyfin/media:/media
    depends_on:
      peertube:
        condition: service_started
      tubemin:
        condition: service_healthy
      jellyfin:
        condition: service_started

volumes:
  tubemin_data:
  caddy_data:
  caddy_config:
  peertube_data:
  peertube_db_data:
  peertube_redis_data:
  jellyfin_config:
  jellyfin_cache:
